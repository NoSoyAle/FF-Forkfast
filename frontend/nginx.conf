server {
    listen 80;
    server_name _;
    # Redirige todo HTTP a HTTPS. MSAL necesita la Web Crypto API del
    # navegador, que solo está disponible en un contexto seguro (HTTPS,
    # o localhost como excepción).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular (SPA): cualquier ruta que no sea un archivo real
    # cae en index.html para que el router de Angular la maneje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que empiece con /api se reenvía al contenedor del backend.
    # Como el navegador solo ve "nginx" (mismo origen), esto elimina
    # cualquier problema de CORS.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        # Quita el header Origin: el navegador ya ve todo como mismo origen,
        # pero Spring rechazaría el POST con "Invalid CORS request" si lo recibe.
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
